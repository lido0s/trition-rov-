[project]
name = "rov-gcs"
version = "0.1.0"
description = "AAST Triton ROVs - Ground Control Station (Phase 1)"
requires-python = ">=3.9"
dependencies = ["pygame>=2.5", "pynput>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gcs"]
